name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main # Trigger the action only when changes are pushed to the main branch.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.14" # Use the required Node.js version

      - name: Install dependencies
        run: |
          npm install

      - name: Build the Next.js application
        run: |
          npm run build  # This will create the .next folder with the built files.

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: out # This is the folder that contains the exported static pages.
          token: ${{ secrets.GITHUB_TOKEN }}
